version: "3"

services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    restart: always
    depends_on:
      - backend
